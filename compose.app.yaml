# Local full-stack override: docker compose -f compose.yaml -f compose.app.yaml up -d --build
services:
  migrate:
    image: branch-office:completion
    build: .
    command: python -m alembic upgrade head
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+psycopg://branch_office:local_dev_password@db:5432/branch_office
    depends_on:
      db:
        condition: service_healthy
  app:
    image: branch-office:completion
    build: .
    ports:
      - '127.0.0.1:18080:8000'
    environment: &local_app_environment
      DATABASE_URL: postgresql+psycopg://branch_office:local_dev_password@db:5432/branch_office
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      COOKIE_SECURE: 'false'
      ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
      ALLOWED_ORIGINS: '["http://localhost:18080","http://127.0.0.1:18080"]'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
  maintenance:
    image: branch-office:completion
    command: python -m app.maintenance
    healthcheck:
      disable: true
    environment: *local_app_environment
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
