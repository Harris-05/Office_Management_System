name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check types and build
        run: npm run build
      - name: Frontend interaction tests
        run: npm test
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: branch_office
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: branch_office_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U branch_office -d branch_office_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REDIS_URL: redis://localhost:6379/2
      TEST_REDIS_URL: redis://localhost:6379/2
      DATABASE_URL: postgresql+psycopg://branch_office:ci_only_password@localhost:5432/branch_office_test
      TEST_DATABASE_URL: postgresql+psycopg://branch_office:ci_only_password@localhost:5432/branch_office_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Apply migrations and check model drift
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Test with coverage
        run: python -m pytest
