services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: branch_office
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: branch_office
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branch_office -d branch_office"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
